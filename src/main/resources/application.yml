spring:
  application:
    name: securepilot
  datasource:
    url: ${SECUREPILOT_DB_URL:jdbc:mysql://localhost:3306/securepilot?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}
    username: ${SECUREPILOT_DB_USERNAME:securepilot}
    password: ${SECUREPILOT_DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
  jackson:
    time-zone: UTC

server:
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

security:
  jwt:
    secret: ${SECUREPILOT_JWT_SECRET}
    access-token-ttl: PT15M
    refresh-token-ttl: P30D
    password-reset-token-ttl: PT30M
